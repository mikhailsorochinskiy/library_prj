version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Порт БД наружу не прокидываем для безопасности!
    # Контейнеры внутри сети докера и так друг друга видят.

  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate && 
             python manage.py create_groups &&
             python manage.py csu &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      - ./media:/app/media
      - static_volume:/app/staticfiles  # Создаем том для статики
    env_file:
      - .env
    depends_on:
      - db
    # Убрали ports, теперь к web нельзя обратиться напрямую из интернета

  nginx:
    image: nginx:1.25-alpine
    restart: always
    ports:
      - "80:80"  # Открываем стандартный HTTP порт наружу
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
      - static_volume:/app/staticfiles  # Nginx должен видеть статику
      - ./media:/app/media              # Nginx должен видеть медиа
    depends_on:
      - web

volumes:
  postgres_data:
  static_volume: