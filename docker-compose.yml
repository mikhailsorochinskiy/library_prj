version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # База надежно спрятана во внутренней сети

  web:
    build: .
    restart: always
    command: >
      sh -c "python manage.py collectstatic --noinput &&
             python manage.py migrate && 
             python manage.py create_groups &&
             python manage.py csu &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    volumes:
      # Прокидываем папки наружу, чтобы Nginx фронтендера мог их читать
      - ./media:/app/media
      - ./staticfiles:/app/staticfiles
    ports:
      # Открываем порт 8000 наружу для Nginx
      # Если Nginx фронтендера стоит на этом же сервере, лучше писать "127.0.0.1:8000:8000" для безопасности
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

volumes:
  postgres_data: